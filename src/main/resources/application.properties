spring.application.name=balloon
server.port=${SERVER_PORT:8000}

spring.datasource.url=jdbc:postgresql://${DB_HOST:157.228.191.29}:${DB_PORT:9000}/${DB_NAME:game}?prepareThreshold=0
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:157.228.191.29}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=5s

jwt.secret=${JWT_SECRET:mySecretKey123456789012345678901234567890123456789012345678901234}
jwt.expiration=${JWT_EXPIRATION:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
